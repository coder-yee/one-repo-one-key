name: Release and Sync Homebrew

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published stable release tag (for example v0.1.2)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: sync-homebrew
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'coder-yee/one-repo-one-key' && github.event.deleted != true && (github.event_name != 'release' || !github.event.release.prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Verify synchronization logic
        run: python3 .github/scripts/test_sync_homebrew.py
      - name: Create Release and update the Homebrew formula
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
          CREATE_RELEASE: ${{ github.event_name == 'push' }}
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: python3 .github/scripts/sync_homebrew.py
